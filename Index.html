<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesquisa de satisfação · Danfer Fotografias</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f4eee2; --paper:#fbf8f1; --card:#fffdf8;
    --green:#1e3a2c; --green2:#2b4d3b; --gold:#b08d57; --gold2:#c9a96e;
    --ink:#26302b; --muted:#7c7566; --line:#e6ddca; --err:#a8432f;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.55;
    background:var(--cream) radial-gradient(circle at 20% 0%,#fbf7ee 0,transparent 60%);-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px}
  header{text-align:center;margin-bottom:22px}
  .mono{width:58px;height:58px;margin:0 auto 10px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;
    font-family:Cinzel,serif;font-size:19px;color:var(--gold);letter-spacing:1px}
  .logo{font-family:'Pinyon Script',cursive;font-size:44px;line-height:1;color:var(--gold)}
  .logo-sub{font-family:Cinzel,serif;font-size:11px;letter-spacing:.42em;color:var(--gold);margin-top:2px}
  .progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:22px 0 8px}
  .progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .5s var(--ease)}
  .step-label{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.04em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 26px;margin-top:16px;
    box-shadow:0 18px 40px -30px rgba(30,58,44,.35);animation:in .45s var(--ease)}
  @keyframes in{from{opacity:0;transform:translateY(12px)}}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:32px;line-height:1.1;color:var(--green);margin:0 0 8px;text-align:center}
  .lead{color:var(--muted);text-align:center;margin:0 0 6px}
  .divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:16px 0 4px;color:var(--gold)}
  .divider:before,.divider:after{content:'';height:1px;width:60px;background:var(--gold2);opacity:.6}
  .q{padding:20px 0;border-top:1px solid var(--line)}
  .q-t{font-weight:600;color:var(--green);margin-bottom:4px}
  .q-t .req{color:var(--gold);margin-left:3px}
  .q-h{font-size:13px;color:var(--muted);margin-bottom:10px}
  .q.miss .q-t{color:var(--err)}
  .q .msg{display:none;font-size:13px;color:var(--err);margin-top:8px}
  .q.miss .msg{display:block}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .opt{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 16px;
    font:inherit;font-size:14px;cursor:pointer;transition:all .2s var(--ease)}
  .opt:hover{border-color:var(--gold2);transform:translateY(-1px)}
  .opt.on{background:var(--green);color:#f4eee2;border-color:var(--green)}
  .scale{display:grid;gap:6px;margin-top:10px}
  .scale.s5{grid-template-columns:repeat(5,1fr)}
  .scale.s11{grid-template-columns:repeat(11,1fr)}
  .scale button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 0;font:inherit;font-weight:600;
    color:var(--green);cursor:pointer;transition:all .2s var(--ease)}
  .scale button:hover{border-color:var(--gold2)}
  .scale button.on{background:var(--gold);border-color:var(--gold);color:#fff}
  .scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
  .stars{display:flex;gap:6px;margin-top:8px}
  .stars button{background:none;border:0;padding:2px;cursor:pointer;font-size:34px;line-height:1;color:var(--line);transition:transform .15s,color .15s}
  .stars button:hover{transform:scale(1.12)}
  .stars button.on{color:var(--gold)}
  input[type=text],textarea{width:100%;margin-top:10px;font:inherit;color:var(--ink);background:var(--paper);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,box-shadow .2s}
  textarea{min-height:96px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,87,.18)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
  .check{display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer}
  .check input{width:20px;height:20px;accent-color:var(--green);margin-top:2px;flex-shrink:0}
  .nav{display:flex;gap:10px;justify-content:space-between;margin-top:24px}
  .btn{border:1px solid var(--green);background:transparent;color:var(--green);border-radius:999px;padding:12px 22px;
    font:inherit;font-weight:600;cursor:pointer;transition:all .2s var(--ease);text-decoration:none;display:inline-block}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:var(--green);color:#f4eee2;margin-left:auto}
  .btn.primary:hover{background:var(--green2)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
  .note{font-size:12.5px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px}
  .alert{display:none;background:#f7e9e3;color:var(--err);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:16px}
  .alert.show{display:block}
  .done{text-align:center}
  .done .seal{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;background:var(--green);color:var(--gold2);display:grid;place-items:center;font-size:32px}
  .status{font-size:13px;color:var(--green);margin-top:10px;min-height:18px}
  .status.err{color:var(--err)}
  footer{text-align:center;font-size:12px;color:var(--muted);margin-top:26px}
  @media(max-width:520px){.card{padding:24px 18px}.scale.s11{grid-template-columns:repeat(6,1fr)}h1{font-size:28px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mono" aria-hidden="true">DF</div>
    <div class="logo">Danfer</div>
    <div class="logo-sub">FOTOGRAFIAS.</div>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="step-label" id="stepLabel" aria-live="polite"></div>
  </header>
  <main id="app"></main>
  <footer>Danfer Fotografias · @danfer.fotografia</footer>
</div>

<script>
/* ============ CONFIGURAÇÃO ============ */
const WHATSAPP = '55XXXXXXXXXXX'; // troque pelo número da Danfer: 55 + DDD + número, sem espaços
const STORE = 'danfer_pesquisa_v1';
const MAX_MSG = 3000;

/* ============ PERGUNTAS ============ */
const STEPS = [
  { title: 'Sua experiência com a Danfer', lead: 'Leva uns 3 minutos. Sua opinião ajuda a gente a cuidar ainda melhor de cada cliente.', qs: [
    { id: 'nome', t: 'Seu nome', h: 'Opcional', type: 'text' },
    { id: 'servico', t: 'Qual serviço você contratou?', type: 'choice', req: true, options: ['Ensaio fotográfico', 'Evento / aniversário', 'Casamento', 'Evento corporativo', 'Outro'] },
    { id: 'video', t: 'Seu pacote incluiu vídeo?', type: 'choice', req: true, options: ['Sim', 'Não'] }
  ]},
  { title: 'Experiência geral', qs: [
    { id: 'geral', t: 'Como você avalia sua experiência geral com a Danfer?', type: 'stars', req: true },
    { id: 'expectativa', t: 'A experiência correspondeu às suas expectativas?', type: 'choice', req: true, options: ['Superou', 'Correspondeu', 'Ficou abaixo'] },
    { id: 'nps', t: 'De 0 a 10, qual a chance de você recomendar a Danfer para um amigo?', type: 'nps', req: true },
    { id: 'nps_motivo', t: 'O que faltou para a nota ser maior?', h: 'Opcional, mas ajuda muito.', type: 'textarea', max: 400, showIf: a => a.nps !== undefined && a.nps <= 6 }
  ]},
  { title: 'Atendimento e comunicação', qs: [
    { id: 'cordialidade', t: 'Como você avalia a cordialidade no atendimento?', type: 'scale5', req: true },
    { id: 'comunicacao', t: 'A comunicação foi clara durante todo o processo?', type: 'scale5', req: true },
    { id: 'atend_motivo', t: 'O que aconteceu no atendimento?', h: 'Conta pra gente, queremos melhorar.', type: 'textarea', max: 400, showIf: a => (a.cordialidade && a.cordialidade <= 2) || (a.comunicacao && a.comunicacao <= 2) },
    { id: 'pontualidade', t: 'A equipe foi pontual e profissional no dia?', type: 'scale5', req: true },
    { id: 'conforto', t: 'Você se sentiu à vontade durante a cobertura ou o ensaio?', type: 'choice', req: true, options: ['Muito', 'Sim', 'Um pouco', 'Não'] }
  ]},
  { title: 'Fotos, vídeo e entrega', qs: [
    { id: 'fotos', t: 'Como você avalia a qualidade das fotografias?', type: 'stars', req: true },
    { id: 'videoq', t: 'Como você avalia o vídeo?', type: 'stars', req: true, showIf: a => a.video === 'Sim' },
    { id: 'prazo', t: 'O prazo de entrega foi respeitado?', type: 'choice', req: true, options: ['Sim', 'Não'] },
    { id: 'entrega_motivo', t: 'O que poderia ter sido melhor na entrega?', type: 'textarea', max: 400, showIf: a => a.prazo === 'Não' },
    { id: 'custo', t: 'Como você avalia o custo-benefício?', type: 'scale5', req: true },
    { id: 'favorito', t: 'Qual foi sua parte favorita do material?', h: 'Opcional', type: 'textarea', max: 400 }
  ]},
  { title: 'Para fechar', privacy: true, qs: [
    { id: 'agradou', t: 'O que mais te agradou na experiência com a Danfer?', type: 'textarea', max: 500 },
    { id: 'melhorar', t: 'O que poderíamos melhorar?', type: 'textarea', max: 500 },
    { id: 'novamente', t: 'Você contrataria a Danfer novamente?', type: 'choice', req: true, options: ['Com certeza', 'Talvez', 'Não'] },
    { id: 'interesse', t: 'Quais serviços você gostaria de conhecer?', type: 'multi', options: ['Ensaio fotográfico', 'Fotografia de eventos', 'Vídeo', 'Casamento'], showIf: a => a.novamente === 'Com certeza' || a.novamente === 'Talvez' },
    { id: 'depoimento', t: 'Quer deixar um depoimento?', h: 'Opcional', type: 'textarea', max: 600 },
    { id: 'aut_depo', type: 'check', label: 'Autorizo a Danfer a publicar meu depoimento com meu nome.', showIf: a => !!(a.depoimento && a.depoimento.trim()) },
    { id: 'aut_novidades', type: 'check', label: 'Quero receber novidades e ofertas da Danfer.' },
    { id: 'aut_contato', type: 'check', label: 'Autorizo a Danfer a entrar em contato para conversar sobre meu feedback.' }
  ]}
];

/* ============ ESTADO ============ */
let answers = {};
let step = 0;
try {
  const s = JSON.parse(localStorage.getItem(STORE) || '{}');
  answers = s.answers || {};
  step = Math.max(0, Math.min(s.step || 0, STEPS.length - 1));
} catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ answers, step })); } catch (e) {} };
const setAns = (id, v) => { answers[id] = v; save(); };

/* ============ UTILIDADES ============ */
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'onclick') e.addEventListener('click', v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && e.append(c.nodeType ? c : document.createTextNode(c)));
  return e;
};
const visible = q => !q.showIf || q.showIf(answers);
const filled = q => {
  const v = answers[q.id];
  return Array.isArray(v) ? v.length > 0 : v !== undefined && v !== null && String(v).trim() !== '';
};
const clean = s => String(s).replace(/[*_~]/g, '');

function syncVisibility() {
  STEPS[step].qs.forEach(q => {
    const b = document.querySelector(`.q[data-id="${q.id}"]`);
    if (b) b.hidden = !visible(q);
  });
  const shown = [...document.querySelectorAll('.q:not([hidden])')];
  shown.forEach((b, i) => b.style.borderTop = i === 0 ? '0' : '');
  const missLeft = document.querySelectorAll('.q.miss:not([hidden])').length;
  const alert = document.getElementById('alert');
  if (alert && !missLeft) alert.classList.remove('show');
}

/* ============ PERGUNTA ============ */
function renderQ(q) {
  const box = el('div', { class: 'q', 'data-id': q.id });
  if (q.type !== 'check') box.append(el('div', { class: 'q-t' }, q.t, q.req ? el('span', { class: 'req', 'aria-label': 'obrigatória' }, '*') : null));
  if (q.h) box.append(el('div', { class: 'q-h' }, q.h));
  const answered = () => { box.classList.remove('miss'); syncVisibility(); };

  if (q.type === 'text') {
    const i = el('input', { type: 'text', placeholder: 'Digite aqui', 'aria-label': q.t });
    i.value = answers[q.id] || '';
    i.addEventListener('input', () => setAns(q.id, i.value));
    box.append(i);
  }

  if (q.type === 'textarea') {
    const max = q.max || 500;
    const t = el('textarea', { maxlength: max, placeholder: 'Escreva com suas palavras', 'aria-label': q.t });
    t.value = answers[q.id] || '';
    const c = el('div', { class: 'count' }, `${t.value.length}/${max}`);
    t.addEventListener('input', () => { setAns(q.id, t.value); c.textContent = `${t.value.length}/${max}`; answered(); });
    box.append(t, c);
  }

  if (q.type === 'choice' || q.type === 'multi') {
    const wrap = el('div', { class: 'opts', role: 'group', 'aria-label': q.t });
    const paint = () => wrap.querySelectorAll('.opt').forEach(b => {
      const on = q.type === 'multi' ? (answers[q.id] || []).includes(b.dataset.v) : answers[q.id] === b.dataset.v;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    });
    q.options.forEach(o => wrap.append(el('button', { type: 'button', class: 'opt', 'data-v': o, onclick: () => {
      if (q.type === 'multi') {
        const cur = new Set(answers[q.id] || []);
        cur.has(o) ? cur.delete(o) : cur.add(o);
        setAns(q.id, [...cur]);
      } else setAns(q.id, o);
      paint(); answered();
    } }, o)));
    paint(); box.append(wrap);
  }

  if (q.type === 'scale5' || q.type === 'nps') {
    const n = q.type === 'nps' ? 11 : 5, start = q.type === 'nps' ? 0 : 1;
    const wrap = el('div', { class: 'scale ' + (n === 11 ? 's11' : 's5'), role: 'group', 'aria-label': q.t });
    const paint = () => wrap.querySelectorAll('button').forEach((b, k) => {
      const on = answers[q.id] === k + start; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    });
    for (let i = start; i < start + n; i++) {
      wrap.append(el('button', { type: 'button', 'aria-label': `Nota ${i}`, onclick: () => { setAns(q.id, i); paint(); answered(); } }, String(i)));
    }
    paint();
    box.append(wrap, el('div', { class: 'scale-legend' },
      el('span', {}, q.type === 'nps' ? 'Nada provável' : 'Ruim'),
      el('span', {}, q.type === 'nps' ? 'Muito provável' : 'Excelente')));
  }

  if (q.type === 'stars') {
    const wrap = el('div', { class: 'stars', role: 'group', 'aria-label': q.t });
    const paint = () => wrap.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('on', k < (answers[q.id] || 0));
      b.setAttribute('aria-pressed', answers[q.id] === k + 1);
    });
    for (let i = 1; i <= 5; i++) {
      wrap.append(el('button', { type: 'button', 'aria-label': `${i} estrela${i > 1 ? 's' : ''}`, onclick: () => { setAns(q.id, i); paint(); answered(); } }, '★'));
    }
    paint(); box.append(wrap);
  }

  if (q.type === 'check') {
    const c = el('input', { type: 'checkbox' });
    c.checked = !!answers[q.id];
    c.addEventListener('change', () => setAns(q.id, c.checked));
    box.append(el('label', { class: 'check' }, c, el('span', {}, q.label)));
  }

  box.append(el('div', { class: 'msg' }, 'Esta resposta é obrigatória.'));
  box.hidden = !visible(q);
  return box;
}

/* ============ ETAPA ============ */
function render() {
  const app = document.getElementById('app');
  const s = STEPS[step];
  document.getElementById('bar').style.width = ((step + 1) / (STEPS.length + 1) * 100) + '%';
  document.getElementById('stepLabel').textContent = `Etapa ${step + 1} de ${STEPS.length}`;

  const card = el('section', { class: 'card' });
  card.append(el('h1', {}, s.title));
  if (s.lead) card.append(el('p', { class: 'lead' }, s.lead));
  card.append(el('div', { class: 'divider', 'aria-hidden': 'true' }, '✦'));
  s.qs.forEach(q => card.append(renderQ(q)));
  if (s.privacy) card.append(el('div', { class: 'note' },
    'Privacidade: usamos suas respostas apenas para melhorar nossos serviços. Seu depoimento só é publicado se você autorizar acima, e você pode pedir a exclusão das suas respostas a qualquer momento.'));
  card.append(el('div', { class: 'alert', id: 'alert', role: 'alert' }));

  const nav = el('div', { class: 'nav' });
  if (step > 0) nav.append(el('button', { type: 'button', class: 'btn', onclick: () => { step--; save(); render(); } }, '← Voltar'));
  const last = step === STEPS.length - 1;
  nav.append(el('button', { type: 'button', class: 'btn primary' + (last ? ' gold' : ''), onclick: next }, last ? 'Enviar respostas' : 'Continuar →'));
  card.append(nav);

  app.innerHTML = '';
  app.append(card);
  syncVisibility();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function next() {
  const qs = STEPS[step].qs.filter(visible);
  const missing = qs.filter(q => q.req && !filled(q));
  document.querySelectorAll('.q').forEach(b => b.classList.toggle('miss', missing.some(m => m.id === b.dataset.id)));
  const alert = document.getElementById('alert');
  if (missing.length) {
    alert.textContent = missing.length === 1 ? 'Falta responder 1 pergunta obrigatória.' : `Faltam responder ${missing.length} perguntas obrigatórias.`;
    alert.classList.add('show');
    document.querySelector('.q.miss')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (step < STEPS.length - 1) { step++; save(); render(); }
  else finish();
}

/* ============ RESUMO E ENVIO ============ */
function summary() {
  const lines = ['*Pesquisa de satisfação · Danfer*', ''];
  STEPS.forEach(s => s.qs.filter(visible).forEach(q => {
    const v = answers[q.id];
    if (v === undefined || v === '' || (Array.isArray(v) && !v.length)) return;
    const label = q.type === 'check' ? q.label : q.t;
    const val = q.type === 'check' ? (v ? 'Sim' : 'Não')
      : q.type === 'stars' ? `${v}/5 ★`
      : Array.isArray(v) ? v.join(', ') : v;
    lines.push(`*${clean(label)}*`, clean(val), '');
  }));
  return lines.join('\n').trim();
}

function finish() {
  const text = summary();
  const app = document.getElementById('app');
  document.getElementById('bar').style.width = '100%';
  document.getElementById('stepLabel').textContent = 'Concluído';

  const numeroOk = /^\d{12,13}$/.test(WHATSAPP);
  const longo = text.length > MAX_MSG;
  const msg = longo ? text.slice(0, MAX_MSG - 60) + '\n\n(mensagem cortada, respostas completas copiadas)' : text;
  const wa = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;

  const status = el('div', { class: 'status', 'aria-live': 'polite' });
  const say = (t, err) => { status.textContent = t; status.classList.toggle('err', !!err); };

  const copiar = async () => {
    try { await navigator.clipboard.writeText(text); say('Respostas copiadas. Se precisar, é só colar no WhatsApp da Danfer.'); }
    catch (e) { say('Não foi possível copiar automaticamente. Selecione e copie o texto manualmente.', true); }
  };

  const enviar = el('a', { class: 'btn primary gold', href: numeroOk ? wa : '#', target: '_blank', rel: 'noopener', style: 'margin:0' }, 'Enviar pelo WhatsApp');
  enviar.addEventListener('click', e => {
    if (!numeroOk) { e.preventDefault(); say('O número do WhatsApp da Danfer ainda não foi configurado.', true); return; }
    if (longo) copiar();
    try { localStorage.removeItem(STORE); } catch (err) {}
    say('Abrindo o WhatsApp… Não esqueça de tocar em enviar.');
  });

  app.innerHTML = '';
  app.append(el('section', { class: 'card done' },
    el('div', { class: 'seal', 'aria-hidden': 'true' }, '✓'),
    el('h1', {}, 'Obrigado!'),
    el('p', { class: 'lead' }, 'Toque no botão abaixo para enviar suas respostas pelo WhatsApp.'),
    el('div', { class: 'divider', 'aria-hidden': 'true' }, '✦'),
    el('div', { class: 'nav', style: 'justify-content:center;flex-wrap:wrap' },
      enviar,
      el('button', { type: 'button', class: 'btn', onclick: copiar }, 'Copiar respostas')),
    status,
    el('div', { style: 'margin-top:14px' },
      el('button', { type: 'button', class: 'btn', onclick: () => render() }, '← Revisar respostas')),
    el('p', { class: 'lead', style: 'margin-top:18px;font-size:14px' }, 'Foi um prazer registrar esse momento com você.')
  ));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
